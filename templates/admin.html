<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ i18n.title }} - Admin Panel</title>
    <style>
        :root { color-scheme: light; --bg:#f3f6fb; --panel:#fff; --text:#172033; --muted:#64748b; --line:#dbe3ef; --primary:#2563eb; --danger:#dc2626; }
        * { box-sizing:border-box; }
        body { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; margin:0; padding:24px; background:var(--bg); color:var(--text); }
        .container { max-width:1400px; margin:auto; }
        .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
        h1 { margin:0; font-size:clamp(1.4rem,3vw,2rem); }
        h2 { margin-top:0; font-size:1.15rem; }
        h3 { margin-top:0; font-size:1rem; }
        .section { background:var(--panel); padding:20px; border:1px solid var(--line); border-radius:12px; margin-bottom:20px; box-shadow:0 4px 16px #0f172a0a; min-width:0; }
        .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
        .flex { display:flex; gap:10px; align-items:center; }
        .flex-1 { flex:1; min-width:0; }
        button, select, input { font:inherit; }
        button { background:var(--primary); color:white; border:0; padding:9px 13px; border-radius:7px; cursor:pointer; white-space:nowrap; }
        button:hover { filter:brightness(.92); } button:disabled { opacity:.55; cursor:wait; }
        button.danger { background:var(--danger); }
        input, select { border:1px solid #cbd5e1; border-radius:7px; padding:9px 10px; background:white; color:inherit; max-width:100%; }
        input:focus, select:focus, button:focus-visible { outline:2px solid #93c5fd; outline-offset:2px; }
        .form-group { margin-bottom:12px; display:flex; flex-direction:column; gap:5px; }
        .radio-group { display:flex; flex-wrap:wrap; gap:14px; margin:7px 0; }
        .radio-group label { display:flex; align-items:center; gap:5px; font-weight:normal; }
        .radio-group input { margin:0; }
        .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
        .toolbar input { flex:1; min-width:160px; }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.92rem; }
        th,td { border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top; }
        th { background:#f8fafc; font-weight:650; white-space:nowrap; }
        .muted { color:var(--muted); font-size:.88rem; }
        .notice { padding:10px 12px; border-radius:8px; background:#eff6ff; color:#1d4ed8; margin:10px 0; }
        .notice.error { background:#fef2f2; color:#b91c1c; }
        .statusline { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:.85rem; }
        @media(max-width:800px) { body{padding:12px}.grid{grid-template-columns:1fr}.section{padding:15px}.form-columns{grid-template-columns:1fr!important}.topbar{align-items:flex-start} }
    </style>
</head>
<body>
<div class="container">
    <header class="topbar">
        <h1>🖥️ <span data-i18n="dashboard">Basis Server Control Panel</span></h1>
        <div class="flex"><label for="language" data-i18n="language">Language</label>
            <select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select>
            <a href="/" data-i18n="monitor">Monitor</a>
        </div>
    </header>
    <div class="section">
        <h2 data-i18n="announcement">📢 Broadcast announcement</h2>
        <div class="flex"><input type="text" id="announce-msg" data-i18n-placeholder="announcementPlaceholder" placeholder="Enter a message…" maxlength="1000" style="flex:1;min-width:0">
            <button onclick="sendAnnounce()" data-i18n="send">Send</button></div>
    </div>
    <div class="grid">
        <section class="section">
            <h2 data-i18n="players">👥 Connected players</h2>
            <div class="toolbar"><input id="player-filter" type="search" data-i18n-placeholder="searchPlayers" placeholder="Search players…" aria-label="Search players">
                <button onclick="loadPlayers()" data-i18n="refresh">Refresh</button></div>
            <div id="players-container" aria-live="polite">{{ i18n.loading }}</div>
        </section>
        <section class="section">
            <h2 data-i18n="worlds">🌐 Loaded worlds</h2>
            <div class="toolbar"><button onclick="loadWorlds()" data-i18n="refresh">Refresh</button>
                <button class="danger" onclick="clearWorlds()" data-i18n="clearWorlds">Clear all worlds</button></div>
            <div id="worlds-container" aria-live="polite">{{ i18n.loading }}</div>
        </section>
    </div>
    <section class="section">
        <h2 data-i18n="worldOperations">⚙️ World operations</h2>
        <div class="grid form-columns">
            <div>
                <h3 data-i18n="loadWorld">Load a world</h3>
                <div class="form-group"><label for="load-url" data-i18n="url">URL</label><input type="url" id="load-url" placeholder="https://…" required></div>
                <div class="form-group"><label for="load-password" data-i18n="password">Password (optional)</label><input type="password" id="load-password" autocomplete="new-password"></div>
                <div class="form-group"><label><input type="checkbox" id="load-persistent"> <span data-i18n="persistent">Keep loaded (persistent)</span></label></div>
                <div class="form-group"><label data-i18n="strategy">Strategy</label><div class="radio-group">
                    <label><input type="radio" name="load-strategy" value="synchronized" checked> <span data-i18n="synchronized">Synchronized</span></label>
                    <label><input type="radio" name="load-strategy" value="immediate"> <span data-i18n="immediate">Immediate</span></label>
                </div></div>
                <button onclick="loadWorldSubmit()" data-i18n="load">Load world</button>
            </div>
            <div>
                <h3 data-i18n="switchWorld">Switch worlds synchronously</h3>
                <div class="form-group"><label for="switch-url" data-i18n="url">URL</label><input type="url" id="switch-url" placeholder="https://…" required></div>
                <div class="form-group"><label for="switch-announce" data-i18n="switchAnnouncement">Announcement (optional)</label><input type="text" id="switch-announce" maxlength="1000"></div>
                <div class="form-group"><label for="switch-delay" data-i18n="delay">Delay (seconds: 0–300)</label><input type="number" id="switch-delay" value="0" min="0" max="300"></div>
                <div class="form-group"><label data-i18n="strategy">Strategy</label><div class="radio-group">
                    <label><input type="radio" name="switch-strategy" value="synchronized" checked> <span data-i18n="synchronized">Synchronized</span></label>
                    <label><input type="radio" name="switch-strategy" value="immediate"> <span data-i18n="immediate">Immediate</span></label>
                </div></div>
                <button onclick="switchWorldSubmit()" data-i18n="switch">Switch world</button>
            </div>
        </div>
    </section>
    <footer class="statusline"><span id="status-message" role="status" aria-live="polite"></span><span><span data-i18n="lastUpdated">Last updated</span>: <time id="last-updated">—</time> · <label><input type="checkbox" id="auto-refresh" checked> <span data-i18n="autoRefresh">Auto-refresh every 5 seconds</span></label></span></footer>
</div>
<script>
const translations = {
 ja: {dashboard:"Basis Server 管理パネル",language:"言語",monitor:"ステータス画面",announcement:"📢 全体アナウンス",announcementPlaceholder:"メッセージを入力…",send:"送信",players:"👥 接続中のプレイヤー",searchPlayers:"プレイヤーを検索…",refresh:"更新",worlds:"🌐 ロード済みワールド",clearWorlds:"すべてのワールドをクリア",worldOperations:"⚙️ ワールド操作",loadWorld:"ワールドをロード",url:"URL",password:"パスワード（任意）",persistent:"常駐させる",strategy:"実行方式",synchronized:"同期",immediate:"即時",load:"ロード",switchWorld:"同期ワールド切り替え",switchAnnouncement:"通知メッセージ（任意）",delay:"遅延（秒: 0〜300）",switch:"切り替え",lastUpdated:"最終更新",autoRefresh:"5秒ごとに自動更新",loading:"読み込み中…",sent:"送信しました",loadSent:"ロード要求を送信しました",switchSent:"ワールド切り替え要求を送信しました",confirmDelete:"このワールドをアンロードしますか？",confirmClear:"本当にすべてのワールドをクリアしますか？",confirm:"確認",error:"エラー",emptyMessage:"メッセージを入力してください。",invalidUrl:"有効なURLを入力してください。",requestFailed:"リクエストに失敗しました",noPlayers:"現在接続中のプレイヤーはいません。",netId:"NetID",displayName:"表示名",platform:"プラットフォーム",position:"現在位置",action:"操作",dm:"個別送信",noWorlds:"ロードされているワールドはありません。",worldInfo:"ワールド情報",settings:"設定",id:"ID",name:"名前",worldStrategy:"戦略",unload:"アンロード",persistentYes:"📌 常駐",persistentNo:"⏳ 一時",locked:"🔒 ロック中",unlocked:"🔓 ロックなし",playersFetchError:"プレイヤー一覧を取得できませんでした",worldsFetchError:"ワールド一覧を取得できませんでした",enterDm:"プレイヤーへのメッセージを入力してください:",cancelled:"キャンセルしました"},
 en: {dashboard:"Basis Server Control Panel",language:"Language",monitor:"Monitor",announcement:"📢 Broadcast announcement",announcementPlaceholder:"Enter a message…",send:"Send",players:"👥 Connected players",searchPlayers:"Search players…",refresh:"Refresh",worlds:"🌐 Loaded worlds",clearWorlds:"Clear all worlds",worldOperations:"⚙️ World operations",loadWorld:"Load a world",url:"URL",password:"Password (optional)",persistent:"Keep loaded (persistent)",strategy:"Strategy",synchronized:"Synchronized",immediate:"Immediate",load:"Load world",switchWorld:"Synchronized world switch",switchAnnouncement:"Announcement (optional)",delay:"Delay (seconds: 0–300)",switch:"Switch world",lastUpdated:"Last updated",autoRefresh:"Auto-refresh every 5 seconds",loading:"Loading…",sent:"Sent successfully",loadSent:"World load request sent",switchSent:"World switch request sent",confirmDelete:"Unload this world?",confirmClear:"Are you sure you want to clear all worlds?",confirm:"Confirm",error:"Error",emptyMessage:"Please enter a message.",invalidUrl:"Please enter a valid URL.",requestFailed:"Request failed",noPlayers:"No players are currently connected.",netId:"NetID",displayName:"Display name",platform:"Platform",position:"Position",action:"Actions",dm:"Direct message",noWorlds:"No worlds are loaded.",worldInfo:"World",settings:"Settings",id:"ID",name:"Name",worldStrategy:"Strategy",unload:"Unload",persistentYes:"📌 Persistent",persistentNo:"⏳ Temporary",locked:"🔒 Locked",unlocked:"🔓 Unlocked",playersFetchError:"Could not fetch players",worldsFetchError:"Could not fetch worlds",enterDm:"Enter a direct message for this player:",cancelled:"Cancelled"}
};
let currentLang = localStorage.getItem("basis-dashboard-lang") || (navigator.language.toLowerCase().startsWith("ja") ? "ja" : "en");
const t = key => (translations[currentLang] || translations.en)[key] || key;
function applyLanguage() {
 document.documentElement.lang = currentLang; document.getElementById("language").value = currentLang;
 document.querySelectorAll("[data-i18n]").forEach(el => { const key=el.dataset.i18n; if (translations[currentLang][key]) el.textContent=translations[currentLang][key]; });
 document.querySelectorAll("[data-i18n-placeholder]").forEach(el => el.placeholder=t(el.dataset.i18nPlaceholder));
 document.title=t("dashboard")+" - Admin";
 translateDynamic(document.getElementById("players-container")); translateDynamic(document.getElementById("worlds-container"));
}
const dynamicMap = { "現在接続中のプレイヤーはいません。":"noPlayers","ロードされているワールドはありません。":"noWorlds","表示名":"displayName","プラットフォーム":"platform","現在位置":"position","操作":"action","ワールド情報":"worldInfo","設定":"settings","戦略:":"worldStrategy","永続化":"persistentYes","一時":"persistentNo","ロック有":"locked","ロック無":"unlocked","アンロード":"unload" };
function translateDynamic(root) { if(!root || currentLang==="ja") return; const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while(n=walker.nextNode()){ let s=n.nodeValue; for(const [jp,key] of Object.entries(dynamicMap)) s=s.replaceAll(jp,t(key)); n.nodeValue=s; } root.querySelectorAll("th,button").forEach(el=>{if(el.textContent.trim()==="DM")el.textContent=t("dm"); if(el.textContent.includes("Unload"))el.textContent="❌ "+t("unload");}); }
document.getElementById("language").addEventListener("change", e=>{currentLang=e.target.value;localStorage.setItem("basis-dashboard-lang",currentLang);applyLanguage();});
document.getElementById("player-filter").addEventListener("input", e=>{const q=e.target.value.toLocaleLowerCase();document.querySelectorAll("#players-container tbody tr").forEach(tr=>tr.hidden=!tr.textContent.toLocaleLowerCase().includes(q));});
function status(message,error=false){const el=document.getElementById("status-message");el.textContent=message;el.className=error?"notice error":"notice";}
async function apiCall(url, method, body=null) {
 const options={method,headers:{'Accept':'application/json, text/html'}}; if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body);}
 try { const res=await fetch(url,options); if(!res.ok){const msg=t("requestFailed")+": "+res.status+" "+res.statusText;status(msg,true);return null;} return res; }
 catch(err){status(t("requestFailed")+": "+err.message,true);return null;}
}
async function loadPlayers(){const el=document.getElementById("players-container");try{const r=await fetch("/admin/players");if(!r.ok)throw Error(r.status);el.innerHTML=await r.text();translateDynamic(el);document.getElementById("player-filter").dispatchEvent(new Event("input"));}catch(e){el.textContent=t("playersFetchError");status(t("playersFetchError"),true);}}
async function loadWorlds(){const el=document.getElementById("worlds-container");try{const r=await fetch("/admin/worlds");if(!r.ok)throw Error(r.status);el.innerHTML=await r.text();translateDynamic(el);}catch(e){el.textContent=t("worldsFetchError");status(t("worldsFetchError"),true);}}
async function sendAnnounce(){const input=document.getElementById("announce-msg"),message=input.value.trim();if(!message){status(t("emptyMessage"),true);return;}const r=await apiCall("/admin/announce","POST",{message});if(r){input.value="";status(t("sent"));}}
async function sendPlayerAnnounce(uuid){const message=prompt(t("enterDm"));if(!message||!message.trim())return;const r=await apiCall("/admin/announce/"+encodeURIComponent(uuid),"POST",{message:message.trim()});if(r)status(t("sent"));}
function validUrl(id){const value=document.getElementById(id).value.trim();try{const u=new URL(value);if(!["http:","https:"].includes(u.protocol))throw Error();return value;}catch{return null;}}
async function loadWorldSubmit(){const url=validUrl("load-url");if(!url){status(t("invalidUrl"),true);return;}const payload={url,password:document.getElementById("load-password").value||null,persistent:document.getElementById("load-persistent").checked,strategy:document.querySelector('input[name="load-strategy"]:checked')?.value||"synchronized"};const r=await apiCall("/admin/worlds/load","POST",payload);if(r){status(t("loadSent"));loadWorlds();}}
async function switchWorldSubmit(){const url=validUrl("switch-url"),delay=Number(document.getElementById("switch-delay").value);if(!url){status(t("invalidUrl"),true);return;}if(!Number.isInteger(delay)||delay<0||delay>300){status(t("delay"),true);return;}const payload={url,password:null,persistent:false,strategy:document.querySelector('input[name="switch-strategy"]:checked')?.value||"synchronized",announce:document.getElementById("switch-announce").value||null,delay};const r=await apiCall("/admin/worlds/switch","POST",payload);if(r)status(t("switchSent"));}
async function deleteWorld(id){if(!confirm(t("confirmDelete")))return;const r=await apiCall("/admin/worlds/"+encodeURIComponent(id),"DELETE");if(r){status(t("sent"));loadWorlds();}}
async function clearWorlds(){if(!confirm(t("confirmClear")))return;const r=await apiCall("/admin/worlds/clear","DELETE");if(r){status(t("sent"));loadWorlds();}}
let refreshTimer=setInterval(()=>{if(document.getElementById("auto-refresh").checked){loadPlayers();loadWorlds();document.getElementById("last-updated").textContent=new Date().toLocaleTimeString(currentLang==="ja"?"ja-JP":"en-US");}},5000);
applyLanguage();loadPlayers();loadWorlds();document.getElementById("last-updated").textContent=new Date().toLocaleTimeString();
</script>
</body>
</html>
