<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Basis Server Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --text: #172033;
            --muted: #64748b;
            --line: #e2e8f0;
            --primary: #2563eb;
            --primary-soft: #eff6ff;
            --success: #15803d;
            --danger: #b91c1c;
            --radius: 14px;
            --shadow: 0 4px 18px rgba(15, 23, 42, .045);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; padding: clamp(16px, 4vw, 40px);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.55;
        }
        .shell { width: min(100%, 1120px); margin: 0 auto; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
        .brand { display:flex; align-items:center; gap:12px; }
        .brand-mark { display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--primary-soft); color:var(--primary); font-size:22px; }
        h1 { margin:0; font-size:clamp(1.35rem, 3vw, 1.8rem); letter-spacing:-.035em; line-height:1.2; }
        .subtitle { margin:5px 0 0; color:var(--muted); font-size:.92rem; }
        .live-pill { display:inline-flex; align-items:center; gap:8px; padding:7px 11px; border:1px solid #bbf7d0; border-radius:999px; color:var(--success); background:#f0fdf4; font-size:.82rem; font-weight:650; }
        .live-dot { width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px #dcfce7; }
        .panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
        .panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px; border-bottom:1px solid var(--line); }
        .panel-head h2 { margin:0; font-size:1.05rem; letter-spacing:-.015em; }
        .panel-head p { margin:4px 0 0; color:var(--muted); font-size:.86rem; }
        .panel-body { padding:22px; }
        .health-content { min-height:170px; }
        .health-content:empty { display:grid; place-items:center; }
        .loading { color:var(--muted); }
        a { color:var(--primary); text-decoration:none; }
        a:hover { text-decoration:underline; }
        footer { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:18px; color:var(--muted); font-size:.82rem; }
        @media(max-width:600px) { body{padding:16px}.panel-head,.panel-body{padding:16px}.topbar{align-items:flex-start} }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">⌘</div>
                <div>
                    <h1>Basis Server</h1>
                    <p class="subtitle">Server status and health overview</p>
                </div>
            </div>
            <span class="live-pill"><span class="live-dot" aria-hidden="true"></span> Auto-updating</span>
        </header>
        <section class="panel" aria-labelledby="health-heading">
            <div class="panel-head">
                <div>
                    <h2 id="health-heading">System overview</h2>
                    <p>Live health metrics refreshed every 5 seconds</p>
                </div>
                <a href="/admin">Admin panel ↗</a>
            </div>
            <div class="panel-body health-content" hx-get="/api/health" hx-trigger="load, every 5s" hx-swap="innerHTML" aria-live="polite">
                <p class="loading">{{ i18n.loading }}</p>
            </div>
        </section>
        <footer>
            <span>Basis Server Dashboard</span>
            <span>Health status refreshes automatically</span>
        </footer>
    </main>
</body>
</html>
